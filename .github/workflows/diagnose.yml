# TEMPORARY. Delete once the CI-only streamable-http failure is understood.
# The two failing tests do not reproduce on any local configuration tried
# (anyio 4.14/4.15, Python 3.12.3/3.12.14, httptools+uvloop present), so the
# runner is the only place that can answer what the server actually sees.
name: diagnose-ci-only-failure

on:
  workflow_dispatch:
  push:
    branches: [fix/networked-worker-prep]

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: environment facts
        continue-on-error: true          # never let facts block the traces
        run: |
          python - <<'PY'
          import importlib.metadata as md, sys
          print("python", sys.version)
          for pkg in ("uvicorn", "anyio", "mcp", "fastmcp", "starlette",
                      "httpx", "httptools", "uvloop", "h11", "sse-starlette"):
              try:
                  print(f"  {pkg:14} {md.version(pkg)}")
              except Exception as exc:
                  print(f"  {pkg:14} ABSENT ({type(exc).__name__})")
          import uvicorn
          from tests.workers.fixtures import build_stub
          c = uvicorn.Config(build_stub().http_app(), host="127.0.0.1", port=0)
          c.load()
          print("http impl :", c.http_protocol_class.__module__)
          print("loop      :", c.loop)
          PY
          echo "--- proxy env ---"; env | grep -iE "proxy|^CI=" || echo "(none)"
          echo "--- cpus ---"; nproc

      - name: "which TEST in test_client_pool.py breaks them"
        continue-on-error: true
        run: |
          T1=tests/workers/test_conformance_streamable_http.py::test_streamable_http_fixture_passes_conformance
          T2=tests/workers/test_discovery.py::test_discover_returns_tool_classes_from_live_fixture
          for t in test_pool_lazy_connects_and_reuses test_pool_call_tool_via_pool \
                   test_pool_unknown_worker_raises test_pool_works_with_stdio_spec \
                   test_pool_mixed_transports; do
            if pytest -q "tests/workers/test_client_pool.py::$t" $T1 $T2 >/dev/null 2>&1; then
              echo "  ok      $t"
            else
              echo "  BREAKS  $t"
            fi
          done

      - name: "lingering tasks and subprocesses after the culprit"
        continue-on-error: true
        run: |
          T1=tests/workers/test_conformance_streamable_http.py::test_streamable_http_fixture_passes_conformance
          pytest -q -s tests/workers/test_client_pool.py $T1 2>&1 \
            | grep -iE "Task was destroyed|pending|exceeded|cancel scope|subprocess|Event loop" \
            | head -40 || true
