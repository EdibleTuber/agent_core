# TEMPORARY. Delete once the CI-only streamable-http failure is understood.
# The two failing tests do not reproduce on any local configuration tried
# (anyio 4.14/4.15, Python 3.12.3/3.12.14, httptools+uvloop present), so the
# runner is the only place that can answer what the server actually sees.
name: diagnose-ci-only-failure

on:
  workflow_dispatch:
  push:
    branches: [fix/networked-worker-prep]

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: environment facts
        run: |
          python -c "import sys, platform; print('python', sys.version)"
          python -c "import uvicorn, anyio, mcp, fastmcp, starlette, httpx; print('uvicorn', uvicorn.__version__, '| anyio', anyio.__version__, '| starlette', starlette.__version__, '| httpx', httpx.__version__)"
          python - <<'PY'
          import uvicorn
          from tests.workers.fixtures import build_stub
          c = uvicorn.Config(build_stub().http_app(), host="127.0.0.1", port=0)
          c.load()
          print("http impl :", c.http_protocol_class.__module__)
          print("ws impl   :", c.ws_protocol_class)
          PY
          echo "--- proxy env ---"; env | grep -iE "proxy|^CI=" || echo "(none)"
          echo "--- cpus ---"; nproc
      - name: the two failing tests, with a server-side trace
        env:
          AGENT_CORE_FIXTURE_TRACE: "1"
          AGENT_CORE_CONFORMANCE_TIMEOUT: "10"
          AGENT_CORE_DISCOVERY_TIMEOUT: "10"
        run: |
          pytest -s -vv --log-cli-level=DEBUG \
            tests/workers/test_conformance_streamable_http.py::test_streamable_http_fixture_passes_conformance \
            tests/workers/test_discovery.py::test_discover_returns_tool_classes_from_live_fixture \
            || true
      - name: a PASSING fixture test, same trace, for comparison
        env:
          AGENT_CORE_FIXTURE_TRACE: "1"
        run: |
          pytest -s -vv tests/workers/test_client.py::test_initialize_completes_against_live_fixture || true
