# TEMPORARY. Delete once the CI-only streamable-http failure is understood.
# The two failing tests do not reproduce on any local configuration tried
# (anyio 4.14/4.15, Python 3.12.3/3.12.14, httptools+uvloop present), so the
# runner is the only place that can answer what the server actually sees.
name: diagnose-ci-only-failure

on:
  workflow_dispatch:
  push:
    branches: [fix/networked-worker-prep]

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: environment facts
        continue-on-error: true          # never let facts block the traces
        run: |
          python - <<'PY'
          import importlib.metadata as md, sys
          print("python", sys.version)
          for pkg in ("uvicorn", "anyio", "mcp", "fastmcp", "starlette",
                      "httpx", "httptools", "uvloop", "h11", "sse-starlette"):
              try:
                  print(f"  {pkg:14} {md.version(pkg)}")
              except Exception as exc:
                  print(f"  {pkg:14} ABSENT ({type(exc).__name__})")
          import uvicorn
          from tests.workers.fixtures import build_stub
          c = uvicorn.Config(build_stub().http_app(), host="127.0.0.1", port=0)
          c.load()
          print("http impl :", c.http_protocol_class.__module__)
          print("loop      :", c.loop)
          PY
          echo "--- proxy env ---"; env | grep -iE "proxy|^CI=" || echo "(none)"
          echo "--- cpus ---"; nproc

      - name: "SCOPE 1 - the two tests alone"
        continue-on-error: true
        run: |
          pytest -q tests/workers/test_conformance_streamable_http.py::test_streamable_http_fixture_passes_conformance \
                    tests/workers/test_discovery.py::test_discover_returns_tool_classes_from_live_fixture \
            && echo "SCOPE1=PASS" || echo "SCOPE1=FAIL"

      - name: "SCOPE 2 - tests/workers only"
        continue-on-error: true
        run: |
          pytest -q tests/workers \
            && echo "SCOPE2=PASS" || echo "SCOPE2=FAIL"

      - name: "SCOPE 3 - the whole suite"
        continue-on-error: true
        run: |
          pytest -q tests \
            && echo "SCOPE3=PASS" || echo "SCOPE3=FAIL"

      - name: "SCOPE 4 - whole suite, but the two run FIRST"
        continue-on-error: true
        run: |
          pytest -q \
            tests/workers/test_conformance_streamable_http.py \
            tests/workers/test_discovery.py \
            tests \
            && echo "SCOPE4=PASS" || echo "SCOPE4=FAIL"
